<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfb">
  <title>Create Dental — клиентский портал</title>
  <link rel="preload" as="image" href="/assets/create-dental-logo.png" fetchpriority="high">
  <link rel="icon" href="/favicon.ico?v=brand-1" sizes="16x16 32x32 48x48 256x256">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=brand-1">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=brand-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand-1">
  <link rel="stylesheet" href="/styles.css?v=task-controls-1">
<link rel="stylesheet" href="/orders-overrides.css?v=33">
<link rel="stylesheet" href="/assets/auth-layout.css?v=portal-layout-4">
<link rel="stylesheet" href="/assets/order-prosthetic-addons.css?v=6">
<link rel="stylesheet" href="/assets/clinic-banner.css?v=1">
<link rel="stylesheet" href="/assets/mobile-cabinets.css?v=jaw-pricing-1">
<link rel="stylesheet" href="/assets/neutral-palette.css?v=2">
  <style>
    .startup-notice{min-height:100vh;display:grid;place-items:center;padding:24px;color:#333;background:#fbfbfb;font:16px/1.5 system-ui,sans-serif;text-align:center}
    html[data-theme="dark"] .startup-notice{color:#eef0f2;background:#17191c}
  </style>
  <script>
    (function(){
      try{localStorage.removeItem('create-dental-locale')}catch(_){ }
      document.documentElement.lang='ru';
      document.documentElement.dir='ltr';
      document.documentElement.dataset.locale='ru';
      var matched=location.pathname.match(/^\/(?:ru|am|uz|kz|uea|uae)(?=\/|$)/);
      if(matched){var path=location.pathname.slice(matched[0].length)||'/';history.replaceState(null,'',path+location.search+location.hash)}
    }());
  </script>
  <script>
    window.addEventListener('error',function(event){
      if(!event.filename||!event.filename.endsWith('.js'))return;
      const notice=document.getElementById('startup-notice');
      if(notice)notice.textContent='Не удалось загрузить кабинет. Обновите страницу. Если ошибка повторится, сообщите администрации.';
    });
    window.addEventListener('DOMContentLoaded',function(){
      setTimeout(function(){
        const notice=document.getElementById('startup-notice');
        if(!notice)return;
        if(location.protocol==='file:'){
          notice.innerHTML='Кабинет открыт как локальный файл и не может загрузить свои модули. Откройте его через сервер: <a href="http://localhost:4173/login">http://localhost:4173/login</a>. Если сервер не запущен, выполните <strong>npm start</strong> в папке проекта.';
          return;
        }
        notice.textContent='Кабинет не загрузился. Обновите страницу или сообщите администрации.';
      },8000);
    });
  </script>
  <script type="module" src="/app.js?v=task-fields-1"></script>
<link rel="stylesheet" href="/assets/interaction-cursors.css?v=5">

</head>
<body><div id="app"><div id="startup-notice" class="startup-notice">Загрузка кабинета...</div></div></body>
</html>
