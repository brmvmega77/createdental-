<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Dental — поддержка</title>
  <link rel="icon" href="/favicon.ico?v=brand-1" sizes="16x16 32x32 48x48 256x256">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=brand-1">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=brand-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand-1">
  <style>
    :root{font:14px Inter,system-ui,sans-serif;color:#333333;background:#fbfbfb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:68px;background:#fff;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;justify-content:space-between;padding:0 28px}header strong{font-size:19px}.support-brand{display:flex;align-items:center;gap:14px}.support-brand img,.login-logo{display:block;width:178px;height:64px;object-fit:cover;object-position:center;background:#fff}.support-brand img{width:145px;height:52px}.support-brand span{font-weight:700}header a{color:#808080;text-decoration:none}.login{max-width:420px;margin:90px auto;padding:32px;background:#fff;border:1px solid #f5f5f5;border-radius:12px;display:grid;gap:15px}.login-logo{margin:0 auto 10px}.login h1{font-size:23px;margin:0}.login p{color:#808080;margin:0;line-height:1.5}.login input,.compose input{border:1px solid #eeeeee;border-radius:8px;padding:12px;min-width:0}.primary{border:0;border-radius:8px;padding:12px 18px;background:#808080;color:#fff;font-weight:700}.error{color:#b42318;min-height:20px}.workspace{height:calc(100vh - 68px);display:grid;grid-template-columns:300px 1fr}.threads{background:#fff;border-right:1px solid #f5f5f5;overflow:auto}.threads h2{font-size:16px;margin:0;padding:20px;border-bottom:1px solid #f5f5f5}.thread{display:block;width:100%;padding:16px 20px;background:#fff;border:0;border-bottom:1px solid #f5f5f5;text-align:left}.thread:hover,.thread.active{background:#f5f5f5}.thread strong,.thread small{display:block}.thread small{color:#808080;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat{display:flex;flex-direction:column;min-width:0}.chat h2{background:#fff;font-size:16px;margin:0;padding:20px;border-bottom:1px solid #f5f5f5}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}.message{max-width:70%;padding:12px 15px;border-radius:10px;background:#f5f5f5;color:#333333;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.message.support{align-self:flex-end;background:#333333;color:#fff}.message time{display:block;margin-top:6px;color:#808080;font-size:11px}.message.support time{color:#eeeeee}.compose{display:flex;gap:10px;padding:16px;background:#fff;border-top:1px solid #f5f5f5}.compose input{flex:1}.empty{color:#808080;margin:auto}@media(max-width:700px){.support-brand span{display:none}.workspace{grid-template-columns:1fr;height:auto}.threads{max-height:180px}.chat{height:calc(100vh - 250px)}}
  </style>
  <script type="module" src="/support.js?v=mobile-fast-1"></script>
</head>
<body>
  <header><strong class="support-brand"><img src="/assets/create-dental-logo.png" alt="Create Dental"><span>Поддержка</span></strong><a href="/">К порталу</a></header>
  <section class="login" id="login">
    <img class="login-logo" src="/assets/create-dental-logo.png" alt="Create Dental">
    <h1>Вход оператора</h1>
    <p>Введите ключ доступа, настроенный для службы поддержки.</p>
    <input id="token" type="password" autocomplete="off" placeholder="Ключ доступа">
    <button id="login-button" class="primary">Открыть диалоги</button>
    <div class="error" id="login-error"></div>
  </section>
  <div class="workspace" id="workspace" hidden>
    <aside class="threads"><h2>Диалоги</h2><div id="threads"></div></aside>
    <section class="chat"><h2 id="chat-title">Выберите диалог</h2><div class="messages" id="messages"><div class="empty">Выберите диалог слева</div></div>
      <form class="compose" id="reply-form"><input id="reply" placeholder="Ответить клиенту..." autocomplete="off" disabled><button class="primary" disabled>Отправить</button></form>
    </section>
  </div>
</body>
</html>
