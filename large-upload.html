<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Загрузка файла — Create Dental</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f6f6;color:#333;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,620px);background:#fff;border:1px solid #ededed;border-radius:22px;padding:32px;box-shadow:0 18px 60px #3331}.logo{font-size:22px;font-weight:800;letter-spacing:.12em;margin-bottom:28px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#999}.card h1{font-size:28px;margin:8px 0 10px}.lead{color:#777;line-height:1.55;margin:0 0 22px}.order{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:#f7f7f7;border-radius:14px;margin-bottom:20px}.order div{display:grid;gap:4px}.order span{font-size:11px;color:#999}.order strong{font-size:14px}.drop{display:grid;place-items:center;min-height:190px;border:2px dashed #d6d6d6;border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:#555;background:#fafafa}.drop input{display:none}.drop b{font-size:36px;font-weight:400}.drop strong{display:block;margin:8px 0 4px}.drop small{color:#999;line-height:1.45}.selected{display:none;align-items:center;gap:12px;margin-top:14px;padding:14px;border:1px solid #eee;border-radius:12px}.selected.show{display:flex}.file-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#f0f0f0;font-size:20px}.selected span{min-width:0;flex:1}.selected strong,.selected small{display:block}.selected strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selected small{color:#999;margin-top:4px}.selected button{border:0;background:none;color:#999;font-size:24px;cursor:pointer}.submit{width:100%;height:50px;margin-top:18px;border:0;border-radius:12px;background:#333;color:#fff;font-size:15px;font-weight:750;cursor:pointer}.submit:disabled{opacity:.45;cursor:default}.progress{display:none;margin-top:18px}.progress.show{display:block}.track{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar{width:0;height:100%;background:#333;transition:width .2s}.status{margin:10px 0 0;color:#777;font-size:13px}.success{display:none;text-align:center;padding:24px 0}.success.show{display:block}.success i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:#e9f7ef;color:#168a55;font-size:32px;font-style:normal}.error{color:#b8464b}.hidden{display:none!important}@media(max-width:520px){.card{padding:22px;border-radius:18px}.card h1{font-size:23px}.order{grid-template-columns:1fr}.drop{min-height:170px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">CREATE DENTAL</div>
    <section id="loader"><p class="lead">Проверяем безопасную ссылку…</p></section>
    <section id="upload" class="hidden">
      <div class="eyebrow">ФАЙЛ К ЗАКАЗУ</div><h1>Загрузить файл</h1>
      <p class="lead">Файл попадёт прямо в карточку заказа и будет храниться в закрытой папке лаборатории.</p>
      <div class="order"><div><span>Клиника</span><strong id="clinic"></strong></div><div><span>Заказ</span><strong id="order"></strong></div><div><span>Пациент</span><strong id="patient"></strong></div><div><span>Работа и срок</span><strong id="work"></strong></div></div>
      <label class="drop" id="drop"><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,.stl,.ply,.zip,.rar,.7z,.doc,.docx,.xls,.xlsx,.txt,.rtf"><span><b>＋</b><strong>Выберите файл</strong><small>или перетащите его сюда<br>до 200 МБ</small></span></label>
      <div class="selected" id="selected"><span class="file-icon">📄</span><span><strong id="file-name"></strong><small id="file-size"></small></span><button id="remove" type="button" aria-label="Убрать файл">×</button></div>
      <button class="submit" id="submit" type="button" disabled>Загрузить в заказ</button>
      <div class="progress" id="progress"><div class="track"><div class="bar" id="bar"></div></div><p class="status" id="status">Подготовка…</p></div>
    </section>
    <section class="success" id="success"><i>✓</i><h1>Файл добавлен</h1><p class="lead">Он уже появился в карточке заказа. Эту страницу можно закрыть.</p></section>
    <p class="status error" id="error"></p>
  </main>
  <script type="module" src="/large-upload.js?v=1"></script>
</body>
</html>
