services:
  web:
    build: .
    image: create-dental:latest
    container_name: create-dental
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./.data:/app/.data
      - ./.backups:/app/.backups
    environment:
      BACKUP_DIR: /app/.backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-0}
