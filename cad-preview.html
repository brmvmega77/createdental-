<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAD · просмотр</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17191c;color:#f0f1f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#17191c 0%,#1e2328 100%)}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-bottom:1px solid #343a41;background:#1b1f23}
    .brand{font-weight:700;letter-spacing:.02em}.meta{color:#9da4ad;font-size:13px}
    main{height:calc(100vh - 64px);padding:18px;display:flex;flex-direction:column;gap:14px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
    .toolbar h1{font-size:18px;margin:0}.toolbar a{display:none;color:#f0f1f2;text-decoration:none;border:1px solid #454c54;border-radius:8px;padding:9px 13px;font-size:13px;background:#252b31}
    .frame{position:relative;flex:1;min-height:280px;overflow:hidden;border:1px solid #343a41;border-radius:12px;background:#202428;box-shadow:0 14px 34px rgb(0 0 0 / 22%)}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .state{position:absolute;inset:0;display:grid;place-items:center;color:#9da4ad;font-size:14px;pointer-events:none}.error{color:#ffb4ad;text-align:center;padding:24px}
    @media(max-width:640px){header{padding:0 16px}main{height:calc(100vh - 64px);padding:12px}.toolbar{align-items:flex-start}.toolbar h1{font-size:16px}.meta{font-size:11px}}
  </style>
<link rel="stylesheet" href="/assets/interaction-cursors.css?v=5">

</head>
<body>
  <header><div class="brand">Create Dental</div><div class="meta">Защищённый просмотр CAD</div></header>
  <main>
    <div class="toolbar"><h1>Интерактивная CAD-модель</h1><a id="external" target="_blank" rel="noopener noreferrer">Открыть во внешнем браузере</a></div>
    <div class="frame"><div id="state" class="state">Загрузка модели…</div><iframe id="model" title="Интерактивная CAD-модель" sandbox="allow-scripts allow-pointer-lock" referrerpolicy="no-referrer"></iframe></div>
  </main>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search),token=params.get('token')||'',state=document.getElementById('state'),frame=document.getElementById('model'),external=document.getElementById('external');
      if(!token){state.textContent='Ссылка на CAD не найдена';state.classList.add('error');return}
      const raw=`/api/cad-preview/${encodeURIComponent(token)}`;external.href=raw;external.style.display='inline-block';
      frame.addEventListener('load',()=>{state.style.display='none'});
      frame.addEventListener('error',()=>{state.textContent='Не удалось загрузить модель. Откройте её во внешнем браузере.';state.classList.add('error')});
      frame.src=raw;
    })();
  </script>
</body>
</html>
